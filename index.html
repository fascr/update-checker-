<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Fasmora Update Checker</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--panel:#101a2b;--panel-2:#152238;--line:rgba(177,202,255,.14);--text:#f4f7ff;--muted:#a5b2c9;--blue:#83b8ff;--mint:#7de2c6;--danger:#ffb4ad}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;overflow-x:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 12% 8%,rgba(69,113,213,.24),transparent 34rem),radial-gradient(ellipse at 93% 82%,rgba(104,72,194,.19),transparent 32rem),var(--bg)}
body:before,body:after{content:"";position:fixed;z-index:-1;width:310px;height:310px;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none}body:before{top:8%;left:-190px;background:#4d8dff}body:after{right:-180px;bottom:2%;background:#9a68ff}
.card{width:min(100%,540px);position:relative;overflow:hidden;padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:30px;background:linear-gradient(150deg,rgba(20,32,52,.96),rgba(12,20,34,.95));box-shadow:0 28px 100px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.045);backdrop-filter:blur(22px)}
.card:before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(143,190,255,.65),transparent)}
.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:850;letter-spacing:-.035em;color:#f6f8ff}.brand:before{content:"F";width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#7cc7ff,#8e83ff);color:#0c1422;font-size:19px;font-weight:950;box-shadow:0 8px 24px rgba(101,151,255,.24)}
.icon{width:72px;height:72px;margin:30px auto 19px;display:grid;place-items:center;border:1px solid rgba(143,190,255,.24);border-radius:23px;background:linear-gradient(145deg,rgba(84,151,255,.19),rgba(137,109,255,.13));color:#b7d8ff;font-size:31px;font-weight:800;box-shadow:0 14px 38px rgba(76,119,223,.15)}
h1{text-align:center;margin:0 0 9px;font-size:clamp(25px,6vw,32px);line-height:1.12;letter-spacing:-.055em}.sub{text-align:center;max-width:390px;margin:0 auto 24px;color:var(--muted);font-size:14px;line-height:1.7}
.status{padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.035);color:#c3cee1;font-size:13px;line-height:1.5}.meta{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0}.meta span{padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);color:var(--muted);font-size:12px;line-height:1.7}.meta b{color:var(--text);font-size:14px;overflow-wrap:anywhere}
.news{margin:22px 0 24px;padding:17px 18px;border:1px solid rgba(125,226,198,.16);border-radius:18px;background:linear-gradient(130deg,rgba(62,155,139,.075),rgba(255,255,255,.018))}.news h2{margin:0 0 11px;font-size:14px;letter-spacing:-.01em}.news ul{display:grid;gap:9px;margin:0;padding:0;list-style:none;color:#c4cde0;font-size:13px;line-height:1.55}.news li{position:relative;padding-left:21px}.news li:before{content:"?";position:absolute;left:0;top:0;color:var(--mint);font-weight:900}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:14px 18px;border:1px solid transparent;border-radius:15px;text-align:center;text-decoration:none;font-size:14px;font-weight:850;background:linear-gradient(110deg,#9dcaff,#9fa1ff);color:#0b1422;box-shadow:0 12px 30px rgba(92,143,255,.17);transition:transform .18s,filter .18s,box-shadow .18s}.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 16px 34px rgba(92,143,255,.24)}.btn:focus-visible{outline:3px solid rgba(157,202,255,.68);outline-offset:3px}.btn.secondary{margin-top:10px;background:rgba(255,255,255,.045);border-color:var(--line);color:#e5edff;box-shadow:none}.btn.secondary:hover{background:rgba(255,255,255,.085)}
.hidden{display:none!important}.foot{text-align:center;color:#7e8ca5;font-size:11px;line-height:1.6;margin-top:19px}.error{color:var(--danger);border-color:rgba(255,130,120,.22);background:rgba(140,46,50,.1)}
@media(max-width:420px){body{padding:14px}.card{padding:23px 19px;border-radius:24px}.icon{width:64px;height:64px;margin-top:24px}.meta{gap:8px}.meta span{padding:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="card">
<div class="brand">Fasmora</div><div class="icon" id="icon">↻</div>
<h1 id="title">Checking for updates…</h1>
<p class="sub" id="message">Reading the latest release information.</p>
<div class="status" id="status">Connecting to update service…</div>
<div id="details" class="hidden">
<div class="meta"><span>Latest version<br><b id="version">—</b></span><span>Released<br><b id="date">—</b></span></div>
<section class="news"><h2>What's new</h2><ul id="whatsNew"></ul></section>
<a class="btn" id="download" href="#" rel="noopener">Download update</a>
<a class="btn secondary hidden" id="altDownload" href="#" rel="noopener">32-bit ARM download</a>
</div>
<div class="foot">Secure update information from the official Fasmora update manifest.</div>
</main>
<script>
const MANIFEST='https://raw.githubusercontent.com/Dancode-del/fasmora-updates/main/update.json';
const q=new URLSearchParams(location.search);
const installedCode=Number(q.get('versionCode')||q.get('code')||0);
const installedName=q.get('version')||'';
const $=id=>document.getElementById(id);
async function detectAbi(){
 // Explicit ABI from Fasmora or another trusted caller is the most reliable signal.
 const explicit=(q.get('abi')||'').toLowerCase();
 if(explicit==='arm64-v8a'||explicit==='armeabi-v7a') return explicit;
 try{
   if(navigator.userAgentData?.getHighEntropyValues){
     const h=await navigator.userAgentData.getHighEntropyValues(['architecture','bitness']);
     const arch=(h.architecture||'').toLowerCase(), bits=String(h.bitness||'');
     if((arch.includes('arm')||arch.includes('aarch'))&&bits==='64') return 'arm64-v8a';
     if(arch.includes('arm')&&bits==='32') return 'armeabi-v7a';
   }
 }catch(_){}
 const ua=navigator.userAgent.toLowerCase();
 if(/aarch64|arm64/.test(ua)) return 'arm64-v8a';
 if(/armv7|armeabi|arm;/.test(ua)) return 'armeabi-v7a';
 return null;
}
async function setDownload(data){
 const d=data.downloads||{}, arm64=d['arm64-v8a'], arm32=d['armeabi-v7a'];
 const abi=await detectAbi();
 $('altDownload').classList.add('hidden');
 if(abi==='arm64-v8a'&&arm64?.url){
   $('download').href=arm64.url;$('download').textContent='Download ARM64 update';
   $('status').textContent+=' • ARM64 detected';
 }else if(abi==='armeabi-v7a'&&arm32?.url){
   $('download').href=arm32.url;$('download').textContent='Download 32-bit ARM update';
   $('status').textContent+=' • 32-bit ARM detected';
 }else{
   // Do not guess ARM64 when the browser hides CPU architecture.
   $('download').classList.add('hidden');
   $('status').textContent+=' • Choose your device type';
   if(arm64?.url){$('download').classList.remove('hidden');$('download').href=arm64.url;$('download').textContent='ARM64 (64-bit)'}
   if(arm32?.url){$('altDownload').classList.remove('hidden');$('altDownload').href=arm32.url;$('altDownload').textContent='32-bit ARM (older devices)'}
 }
}
fetch(MANIFEST,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{
 const latest=Number(data.latestVersionCode||0);
 $('version').textContent=data.latestVersionName||latest||'Unknown';
 $('date').textContent=data.releaseDate||'—';
 $('whatsNew').innerHTML='';
 (Array.isArray(data.whatsNew)?data.whatsNew:[]).forEach(x=>{const li=document.createElement('li');li.textContent=x;$('whatsNew').appendChild(li)});
 $('details').classList.remove('hidden');
 if(installedCode>0&&latest>0&&installedCode>=latest){
   $('icon').textContent='✓';$('title').textContent='You’re up to date';
   $('message').textContent='Your installed version is the latest available version.';
   $('status').textContent='Installed: '+(installedName||installedCode)+' • Latest: '+(data.latestVersionName||latest);
   $('download').classList.add('hidden');$('altDownload').classList.add('hidden');
 }else{
   $('icon').textContent='↓';$('title').textContent=data.title||'Update available';
   $('message').textContent=data.message||'A newer version is available to download.';
   $('status').textContent=installedCode>0?'Installed: '+(installedName||installedCode)+' • Update available':'Latest release available • '+(data.required?'Required update':'Optional update');
   setDownload(data);
 }
}).catch(()=>{
 $('icon').textContent='!';$('title').textContent='Couldn’t check for updates';
 $('message').textContent='The update information could not be loaded. Please check your connection and try again.';
 $('status').textContent='Update service unavailable';$('status').classList.add('error');
});
</script></body></html>
